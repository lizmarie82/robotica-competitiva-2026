name: Compilar sketches Arduino (multi-plataforma)

on:
  push:
    branches:
      - main
      - 'mejoras/**'
  pull_request:
    branches:
      - main

jobs:

  compilar-esp32:
    name: ESP32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          sketch-paths: |
            - 01_uart/uart_pc_esp32
          cli-compile-flags: |
            - --warnings=all

  compilar-arduino-uno:
    name: Arduino UNO / Nano
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - 01_uart/uart_pc_arduino_uno
          cli-compile-flags: |
            - --warnings=all

  compilar-arduino-mega:
    name: Arduino Mega 2560
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:mega:cpu=atmega2560
          sketch-paths: |
            - 01_uart/uart_pc_arduino_mega
          cli-compile-flags: |
            - --warnings=all
